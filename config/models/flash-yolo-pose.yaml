# Flash-YOLO-pose 姿态估计模型结构定义
# flash-yolo.yaml 的 backbone/neck **逐行相同**，只把最后一行 Detect 换成 Pose26
# （Detect + cv4 关键点特征 + cv4_kpts 坐标/可见性 + cv4_sigma 训练期不确定度 +
#  RealNVP 归一化流；sigma/flow 只在训练与权重加载时存在，推理/导出不参与前向）。
# 头输入通道 = [64, 128, 256]；Pose26 内 c4 = max(64 // 4, 17 * (3 + 2)) = 85。
# nc=1：COCO-pose 只有 person 一类；自定义关键点数据集可用 --data 的 nc/描述符覆盖。
# 行语法：[from, repeats, module, args]
nc: 1
reg_max: 1
end2end: True
kpt_shape: [17, 3]

scales:
  # [depth, width, max_channels]
  flash: [1.0, 1.0, 1024]

backbone:
  - [-1, 1, Conv, [16, 3, 2]]            # 0  P1/2（RGB 入口，保留 3×3 s2）
  - [-1, 1, PoolConv, [32]]              # 1  P2/4（全池化下采样）
  - [-1, 1, DWConv, [32, 3, 1]]          # 2  stem：depthwise 空间混合（筛选胜出的一刀）
  - [-1, 1, Conv, [64, 1, 1]]            # 3  stem 通道投影（P1/P2 输出无下游消费者）
  - [-1, 1, PoolConv, [64]]              # 4  P3/8
  - [-1, 1, C3k2, [128, False, 0.25]]    # 5
  - [-1, 1, PoolConv, [128]]             # 6  P4/16
  - [-1, 1, C3k2, [128, True]]           # 7
  - [-1, 1, PoolConv, [256]]             # 8  P5/32
  - [-1, 1, C3k2, [256, True]]           # 9
  - [-1, 1, SPPF, [256, 5, 3, True]]     # 10
  - [-1, 1, C2PSA, [256]]                # 11

head:
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 7], 1, Concat, [1]]                # 13  ← backbone P4（+1 层后的索引）
  - [-1, 1, C3k2, [128, True]]               # 14
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 5], 1, Concat, [1]]                # 16  ← backbone P3
  - [-1, 1, C3k2, [64, True]]                # 17 (P3/8)
  - [-1, 1, PoolConv, [64]]                  # 18
  - [[-1, 14], 1, Concat, [1]]               # 19
  - [-1, 1, C3k2, [128, True]]               # 20 (P4/16)
  - [-1, 1, PoolConv, [128]]                 # 21
  - [[-1, 11], 1, Concat, [1]]               # 22  ← backbone P5 / C2PSA
  - [-1, 1, C3k2, [256, True, 0.5, True]]    # 23 (P5/32, attn)
  - [[17, 20, 23], 1, Pose26, [nc, kpt_shape]]  # 24
