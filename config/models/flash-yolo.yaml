# Flash-YOLO 检测模型结构定义（本项目自有架构；2026-10-10 定稿 = 第一轮筛选胜者 S2 设计）
#
# 设计命题：v3-tiny 的廉价下采样哲学（PoolConv = maxpool + 1×1）× yolo26 的 CSP 容量分配；
#          DW stem = depthwise 3×3 空间混合 + 1×1 投影，替掉 P1/P2 段那个无下游消费者的 C3k2。
#          筛选依据（20 轮同预算，见 README「Flash-YOLO」）：DW stem 版同算力比 1×1 stem 版
#          高 +0.67 mAP，b1 速度持平（TRT 1.33 vs 1.32ms）——所以 stem 用 DW。
#          头（Detect, E2E）与损失/训练管线完全复用 yolo26。
# 相对 yolo26n @640：GFLOPs 3.80（−31%，summary 口径）· 参数 1.97M。筛选变体见同目录 s1-s4
#          （s1 = 旧主设计；S2 即本结构，筛选时经 --cfg 引用）。
# 档位：单档 flash，通道已材料化（width = 1.0，无缩放）；行语法：[from, repeats, module, args]

nc: 80
reg_max: 1
end2end: True

scales:
  # [depth, width, max_channels]
  flash: [1.0, 1.0, 1024]

backbone:
  - [-1, 1, Conv, [16, 3, 2]]            # 0  P1/2（RGB 入口，保留 3×3 s2）
  - [-1, 1, PoolConv, [32]]              # 1  P2/4（全池化下采样）
  - [-1, 1, DWConv, [32, 3, 1]]          # 2  stem：depthwise 空间混合（筛选胜出的一刀）
  - [-1, 1, Conv, [64, 1, 1]]            # 3  stem 通道投影（P1/P2 输出无下游消费者）
  - [-1, 1, PoolConv, [64]]              # 4  P3/8
  - [-1, 1, C3k2, [128, False, 0.25]]    # 5
  - [-1, 1, PoolConv, [128]]             # 6  P4/16
  - [-1, 1, C3k2, [128, True]]           # 7
  - [-1, 1, PoolConv, [256]]             # 8  P5/32
  - [-1, 1, C3k2, [256, True]]           # 9
  - [-1, 1, SPPF, [256, 5, 3, True]]     # 10
  - [-1, 1, C2PSA, [256]]                # 11

head:
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 7], 1, Concat, [1]]                # 13  ← backbone P4（+1 层后的索引）
  - [-1, 1, C3k2, [128, True]]               # 14
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 5], 1, Concat, [1]]                # 16  ← backbone P3
  - [-1, 1, C3k2, [64, True]]                # 17 (P3/8)
  - [-1, 1, PoolConv, [64]]                  # 18
  - [[-1, 14], 1, Concat, [1]]               # 19
  - [-1, 1, C3k2, [128, True]]               # 20 (P4/16)
  - [-1, 1, PoolConv, [128]]                 # 21
  - [[-1, 11], 1, Concat, [1]]               # 22  ← backbone P5 / C2PSA
  - [-1, 1, C3k2, [256, True, 0.5, True]]    # 23 (P5/32, attn)
  - [[17, 20, 23], 1, Detect, [nc]]          # 24
