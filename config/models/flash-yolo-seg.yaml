# Flash-YOLO-seg 实例分割模型结构定义（flash-yolo 的 seg 变体）
#
# 与 flash-yolo.yaml 的唯一差异：最后一行 Detect -> Segment26（与 yolo26 -> yolo26-seg 同构）。
# backbone/neck 逐行相同；Segment26 已含 cv4 mask 系数分支、Proto26 原型与训练期 semseg 辅助头，
# 所以这里仍然只有一行头。P3/P4/P5 通道 64/128/256 与 yolo26n 相同，Segment26 参数直接复用。
# 档位：单档 flash（通道已材料化，无缩放）；行语法：[from, repeats, module, args]

nc: 80
reg_max: 1
end2end: True

scales:
  # [depth, width, max_channels]
  flash: [1.0, 1.0, 1024]

backbone:
  - [-1, 1, Conv, [16, 3, 2]]            # 0  P1/2（RGB 入口，保留 3×3 s2）
  - [-1, 1, PoolConv, [32]]              # 1  P2/4（全池化下采样）
  - [-1, 1, DWConv, [32, 3, 1]]          # 2  stem：depthwise 空间混合（筛选胜出的一刀）
  - [-1, 1, Conv, [64, 1, 1]]            # 3  stem 通道投影（P1/P2 输出无下游消费者）
  - [-1, 1, PoolConv, [64]]              # 4  P3/8
  - [-1, 1, C3k2, [128, False, 0.25]]    # 5
  - [-1, 1, PoolConv, [128]]             # 6  P4/16
  - [-1, 1, C3k2, [128, True]]           # 7
  - [-1, 1, PoolConv, [256]]             # 8  P5/32
  - [-1, 1, C3k2, [256, True]]           # 9
  - [-1, 1, SPPF, [256, 5, 3, True]]     # 10
  - [-1, 1, C2PSA, [256]]                # 11

head:
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 7], 1, Concat, [1]]                # 13  ← backbone P4（+1 层后的索引）
  - [-1, 1, C3k2, [128, True]]               # 14
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 5], 1, Concat, [1]]                # 16  ← backbone P3
  - [-1, 1, C3k2, [64, True]]                # 17 (P3/8)
  - [-1, 1, PoolConv, [64]]                  # 18
  - [[-1, 14], 1, Concat, [1]]               # 19
  - [-1, 1, C3k2, [128, True]]               # 20 (P4/16)
  - [-1, 1, PoolConv, [128]]                 # 21
  - [[-1, 11], 1, Concat, [1]]               # 22  ← backbone P5 / C2PSA
  - [-1, 1, C3k2, [256, True, 0.5, True]]    # 23 (P5/32, attn)
  - [[17, 20, 23], 1, Segment26, [nc, 32, 64]]   # 24 (nm=32 任务常数；npr=64 = yolo26n-seg 的生效值)
