# YOLOv3-tiny 检测模型结构定义
# 结构事实源自 darknet 官方 cfg（cfg/yolov3-tiny.cfg，416 输入；论文 arXiv:1804.02767 谱系）
# 行语法：[from, repeats, module, args]
# 两个转写要点：
#   ① 保尺寸池化（darknet [maxpool] size=2 stride=1 的隐式 padding）= ZeroPad2d(右下 pad 1) + MaxPool2d(2,1)；
#   ② 两颗 1×1→255 输出卷积折进 V3Detect（同 yolo26 的 Detect 持有 cv2/cv3 的惯例）。

nc: 80
# anchors 照官方原值（darknet 固定像素单位，**不随 imgsz 缩放**）：官方权重在多尺度训练下
# 由 tw 自补偿输入尺度，锚值保持原样才与权重配套（实测 640 输入沿用原锚值 AP50 0.41；
# 线性缩放到 640 只有 0.15）。从零训练换输入尺寸时应重聚类先验（darknet calc_anchors 口径）。
# 每级 3 槽 × [w, h]，级序 = V3Detect 的 from 顺序 [P4/16, P5/32]；
# 官方 mask 分配照原样：P5 档 mask 3,4,5 / P4 档 mask 1,2,3——原版历史坑（81,82 被两个
# 尺度共用、10,14 从未启用）忠实保留，官方权重即照此训练
anchors:
  - [[23, 27], [37, 58], [81, 82]]       # P4/16
  - [[81, 82], [135, 169], [344, 319]]   # P5/32
strides: [16, 32]

scales:
  # [depth, width, max_channels]——v3-tiny 无缩放（width_multiple=1.0）
  tiny: [1.0, 1.0, 1024]

backbone:
  - [-1, 1, LeakyConv, [16, 3, 1]]        # 0  416
  - [-1, 1, MaxPool2d, [2, 2]]            # 1  208
  - [-1, 1, LeakyConv, [32, 3, 1]]        # 2  208
  - [-1, 1, MaxPool2d, [2, 2]]            # 3  104
  - [-1, 1, LeakyConv, [64, 3, 1]]        # 4  104
  - [-1, 1, MaxPool2d, [2, 2]]            # 5  52
  - [-1, 1, LeakyConv, [128, 3, 1]]       # 6  52
  - [-1, 1, MaxPool2d, [2, 2]]            # 7  26
  - [-1, 1, LeakyConv, [256, 3, 1]]       # 8  26 ← P4 融合来源
  - [-1, 1, MaxPool2d, [2, 2]]            # 9  13
  - [-1, 1, LeakyConv, [512, 3, 1]]       # 10 13
  - [-1, 1, ZeroPad2d, [[0, 1, 0, 1]]]    # 11 13（右下各补 1 行/列）
  - [-1, 1, MaxPool2d, [2, 1]]            # 12 13

head:
  - [-1, 1, LeakyConv, [1024, 3, 1]]      # 13 13
  - [-1, 1, LeakyConv, [256, 1, 1]]       # 14 13
  - [-1, 1, LeakyConv, [512, 3, 1]]       # 15 P5/32 头输入（512ch）
  - [-2, 1, LeakyConv, [128, 1, 1]]       # 16 darknet route -4（parse 期归一化为绝对 14）
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 17 26
  - [[17, 8], 1, Concat, [1]]             # 18 128+256=384，26×26
  - [-1, 1, LeakyConv, [256, 3, 1]]       # 19 P4/16 头输入（256ch）
  - [[19, 15], 1, V3Detect, [nc]]         # 20 双尺度检测（含两颗 1×1→255 卷积）
