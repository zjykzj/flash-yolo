# YOLO26 姿态估计模型结构定义
# 结构事实源自官方 yolo26-pose.yaml：backbone+neck 与 yolo26.yaml **逐行相同**，只换最后一行为
# Pose26（= Detect + cv4 关键点特征 + cv4_kpts 坐标/可见性 + cv4_sigma 训练期不确定度 +
# RealNVP 归一化流；sigma/flow 只在训练与权重加载时存在，推理/导出不参与前向）
# 行语法：[from, repeats, module, args]
#
# nc=1：官方 yaml 写 nc: 80（历史默认值），实际 COCO-pose 数据集只有 person 一类，
# 官方 checkpoint 的头也是 nc=1；本工程按"yaml = 结构事实"写 1，避免 strict load 尺寸不符。
nc: 1
reg_max: 1
end2end: True
kpt_shape: [17, 3]

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5  P4/16
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]    # 9  (YOLO26 形式：cv1 无激活 + 恒等残差)
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                 # 12
  - [-1, 2, C3k2, [512, True]]                # 13
  - [-1, 1, Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                 # 15
  - [-1, 2, C3k2, [256, True]]                # 16 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                # 17
  - [[-1, 13], 1, Concat, [1]]                # 18
  - [-1, 2, C3k2, [512, True]]                # 19 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                # 20
  - [[-1, 10], 1, Concat, [1]]                # 21
  - [-1, 1, C3k2, [1024, True, 0.5, True]]    # 22 (P5/32, attn)
  - [[16, 19, 22], 1, Pose26, [nc, kpt_shape]]  # 23
