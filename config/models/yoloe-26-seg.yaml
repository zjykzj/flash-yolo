# YOLOE-26 开放词汇实例分割模型结构定义
# 结构事实源自官方 yoloe-26-seg.yaml：backbone+neck 与 yolo26-seg.yaml **逐行相同**，只换最后一行
# YOLOESegment26（= Segment26 的嵌入化变体：cv3 -> 512-d 嵌入分支 + BNContrastiveHead/文本布局 或
# lrpc 烘焙词汇/pf 布局）。官方 26 家族只有 seg 权重（-seg / -seg-pf）。
# 行语法：[from, repeats, module, args]

nc: 80
reg_max: 1
end2end: True
text_model: mobileclip2:b   # 留档（官方 yoloe-26 文本编码器；M2 文本模式用）
prompt_free: false           # true = pf 布局（lrpc + cv2/cv3 截断）；false = 文本布局（cv4 + 完整 cv2/cv3）
vocab_size: 4585             # pf 词汇数（官方 RAM++ 值）；与 metadata names 长度硬对账（apply_meta）

scales:
  # [depth, width, max_channels, pf_channels?]
  # 第 4 项（可选）是 pf 布局的提案卷积输出通道：官方 -pf 资产由不同版本代码产出——
  # n（2026-09 新分支）= 512（复用 cv3 尾部卷积），s/m/l/x（2026-01 旧分支）= 1
  # （专用单通道，实测五档 ckpt）。行为一致（都只取第 0 通道作提案分数），
  # strict load 形状不同；缺省 = 512。
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024, 1]
  m: [0.50, 1.00, 512, 1]
  l: [1.00, 1.00, 512, 1]
  x: [1.00, 1.50, 512, 1]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5  P4/16
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]    # 9  (YOLO26 形式：cv1 无激活 + 恒等残差)
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                 # 12
  - [-1, 2, C3k2, [512, True]]                # 13
  - [-1, 1, Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                 # 15
  - [-1, 2, C3k2, [256, True]]                # 16 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                # 17
  - [[-1, 13], 1, Concat, [1]]                # 18
  - [-1, 2, C3k2, [512, True]]                # 19 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                # 20
  - [[-1, 10], 1, Concat, [1]]                # 21
  - [-1, 1, C3k2, [1024, True, 0.5, True]]    # 22 (P5/32, attn)
  - [[16, 19, 22], 1, YOLOESegment26, [nc, 32, 256, 512, True]]  # 23  (nm=32 任务常数；npr=256 随 width 缩放)
